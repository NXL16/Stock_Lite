global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: stocklite-api
    metrics_path: /metrics
    static_configs:
      - targets: [172.18.0.1:5002]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
