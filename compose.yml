services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocklite
      POSTGRES_USER: stocklite
      POSTGRES_PASSWORD: stocklite_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres-data:
